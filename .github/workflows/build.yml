name: Build

on:
  workflow_dispatch:

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        continue-on-error: true
        name: Check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"
  build:
    runs-on: ubuntu-latest
    name: Build
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    steps:
      - name: Checkout tool
        uses: actions/checkout@v4
        with:
          repository: AGTTeam/FMAKamiTranslation
          token: ${{ secrets.GH_PAT }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pipenv"
      - name: Install pipenv
        run: python -m pip install --upgrade pipenv wheel
      - name: Checkout data
        uses: actions/checkout@v4
        with:
          path: FMAKamiData
      - name: Download data
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: ${{ secrets.URL_DATA }}
      - name: Extract data
        run: 7z x fma.7z
      - name: Install dependencies
        run: pipenv --python 3.12 sync
      - name: Extract
        run: pipenv run python tool.py extract --iso --dig --txt
      - name: Repack
        run: pipenv run python tool.py repack
      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: patch.xdelta
          path: FMAKamiData/patch.xdelta
          retention-days: 7
      - name: Check patch existence
        id: check_patch
        uses: andstor/file-existence-action@v3
        with:
          files: "FMAKamiData/patch.xdelta"
      - name: Delete release
        if: ${{ steps.check_patch.outputs.files_exists == 'true' }}
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: nightly
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        if: ${{ steps.check_patch.outputs.files_exists == 'true' }}
        with:
          repo_token: "${{ secrets.GH_PAT }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "Nightly Build"
          files: |
            FMAKamiData/patch.xdelta
      - name: Webhook
        if: ${{ steps.check_patch.outputs.files_exists == 'true' }}
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: "A new nightly patch is available for testing! ${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly"
          username: "AGTTBot"
          avatar-url: "https://avatars.githubusercontent.com/u/123242276?v=4"
